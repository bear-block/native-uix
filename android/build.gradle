buildscript {
  ext.kotlin_version = '2.2.0'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
  }
}

// Native UIX supports the New Architecture only (Fabric, custom C++ shadow nodes).
if (rootProject.findProperty('newArchEnabled')?.toString() == 'false') {
  throw new GradleException('@bear-block/native-uix requires the React Native New Architecture (newArchEnabled=true).')
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

react {
  libraryName = 'NativeUIXSpec'
  codegenJavaPackageName = 'dev.nativeuix'
}

android {
  namespace 'dev.nativeuix'
  compileSdkVersion 37

  defaultConfig {
    minSdkVersion 24
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation('com.facebook.react:react-android')
  implementation('com.google.android.material:material:1.13.0')
  implementation('androidx.recyclerview:recyclerview:1.4.0')
  implementation('androidx.transition:transition:1.5.0')
}
