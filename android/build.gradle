buildscript {
  ext.kotlin_version = '2.2.0'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version")
  }
}

// Native UIX supports the New Architecture only (Fabric, custom C++ shadow nodes).
if (rootProject.findProperty('newArchEnabled')?.toString() == 'false') {
  throw new GradleException('@bear-block/native-uix requires the React Native New Architecture (newArchEnabled=true).')
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.facebook.react'

react {
  libraryName = 'NativeUIXSpec'
  codegenJavaPackageName = 'dev.nativeuix'
}

android {
  namespace 'dev.nativeuix'
  buildFeatures { compose true }
  compileSdkVersion 37

  defaultConfig {
    minSdkVersion 24
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation('com.facebook.react:react-android')
  // Material 3 Expressive components (flexible app bars) exist only in Compose
  // and only in this alpha; tracked until a stable release (ADR-0007).
  implementation('androidx.compose.ui:ui:1.9.0')
  implementation('androidx.compose.foundation:foundation:1.9.0')
  implementation('androidx.compose.material3:material3:1.5.0-alpha06')
  implementation('com.google.android.material:material:1.13.0')
  implementation('androidx.recyclerview:recyclerview:1.4.0')
  implementation('androidx.transition:transition:1.5.0')
}
