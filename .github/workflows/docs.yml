name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation and validate internal links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - name: Build with the GitHub Pages base path
        run: npm run build
        working-directory: website
        env:
          DOCS_BASE: /native-uix/
      - name: Preserve build for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: website/.vitepress/dist
          retention-days: 7
      - name: Check Pages configuration
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getPages(context.repo);
              const ready = data.build_type === 'workflow';
              core.setOutput('ready', String(ready));
              if (!ready) core.warning('Docs built. Set Settings → Pages → Source to GitHub Actions to enable deployment.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('ready', 'false');
              core.warning('Docs built; GitHub Pages is not enabled. Set Settings → Pages → Source to GitHub Actions.');
            }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
